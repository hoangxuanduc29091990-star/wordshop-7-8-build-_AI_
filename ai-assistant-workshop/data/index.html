<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini AI Assistant - Độc lập</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <div class="chat-window">
            <div class="header">
                <h2>🤖 Trợ lý AI Thông minh (Standalone)</h2>
            </div>
            <div class="body" id="msgContainer">
                <div class="msg assistant">Xin chào! Tôi là Trợ lý AI Gemini. Tôi có thể giúp gì cho bạn hôm nay?</div>
            </div>
            <div class="footer">
                <input type="text" id="chatInput" placeholder="Nhập câu hỏi của bạn...">
                <button id="sendBtn">Gửi</button>
            </div>
        </div>
    </div>
    
    <!-- Link đến file logic xử lý -->
    <script src="app.js"></script>
</body>
</html>
